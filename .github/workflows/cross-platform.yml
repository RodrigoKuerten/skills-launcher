name: cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - run: npm ci
      - run: npm run typecheck -w @skills-launcher/desktop
      - run: npm run ui:build -w @skills-launcher/desktop
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  agents:
    name: agents / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: ubuntu-26.04
            os: ubuntu-26.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - run: npm ci
      - run: npm run ui:build -w @skills-launcher/desktop
      - name: Install real AI agents
        working-directory: apps/desktop
        run: bash scripts/install-real-agents.sh
      - name: Real agent detection, install and uninstall
        working-directory: apps/desktop/src-tauri
        env:
          SKILLS_LAUNCHER_EXPECT_HOSTS: claude-code,codex,cursor,copilot,gemini-cli,windsurf,opencode
        run: cargo test real_agents_detect_install_uninstall -- --ignored --nocapture

  linux-e2e:
    name: linux-e2e / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf xvfb dbus-x11 xdotool imagemagick x11-utils
      - run: npm ci
      - name: Build Linux packages
        working-directory: apps/desktop
        run: npm run build
      - name: Install the Debian package
        run: |
          set -euo pipefail
          deb="$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)"
          test -n "$deb"
          deb="$(realpath "$deb")"
          sudo apt-get install -y "$deb"
          command -v skills-launcher
      - name: Sync all seeded sources on Linux
        working-directory: apps/desktop/src-tauri
        run: cargo test seeded_sources_sync_smoke -- --ignored --nocapture
      - name: Launch installed Linux package
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
          EVIDENCE_DIR: ${{ runner.temp }}/gui-evidence
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
            bash apps/desktop/scripts/gui-smoke-linux.sh "$(command -v skills-launcher)" "$EVIDENCE_DIR"
      - name: Upload Linux package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-evidence
          path: ${{ runner.temp }}/gui-evidence
          if-no-files-found: warn

  runtime:
    name: runtime / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-24.04
            os: ubuntu-24.04
          - name: linux-26.04
            os: ubuntu-26.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build/runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf xvfb dbus-x11 xdotool imagemagick x11-utils
      - run: npm ci
      - name: Build Tauri binary
        working-directory: apps/desktop
        run: npm run build:exe
      - name: GUI smoke and screenshot (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
          EVIDENCE_DIR: ${{ runner.temp }}/gui-evidence
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" \
            bash scripts/gui-smoke-linux.sh "$PWD/src-tauri/target/release/skills-launcher" "$EVIDENCE_DIR"
      - name: GUI smoke and screenshot (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/gui-evidence
        run: |
          bash scripts/gui-smoke-macos.sh "$PWD/src-tauri/target/release/skills-launcher" "$EVIDENCE_DIR"
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: ${{ runner.temp }}/gui-evidence
          if-no-files-found: warn
