name: cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - run: npm ci
      - run: npm run typecheck -w @skills-launcher/desktop
      - run: npm run ui:build -w @skills-launcher/desktop
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  runtime:
    name: runtime / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build/runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf xvfb dbus-x11
      - run: npm ci
      - run: npm run ui:build -w @skills-launcher/desktop
      - name: Build Tauri binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
      - name: Launch smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            ./target/release/skills-launcher > /tmp/skills-launcher.log 2>&1 &
            pid=$!
            sleep 10
            if ! kill -0 "$pid"; then
              cat /tmp/skills-launcher.log
              exit 1
            fi
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          '
      - name: Launch smoke test (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: |
          ./target/release/skills-launcher > /tmp/skills-launcher.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid"; then
            cat /tmp/skills-launcher.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
