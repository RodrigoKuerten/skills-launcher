name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            paths: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-24.04
            paths: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-arm64
            os: macos-latest
            paths: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf
      - run: npm ci
      - name: Build ${{ matrix.name }} bundle
        working-directory: apps/desktop
        run: npm run build
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          ls -lh release-files
      - name: Generate checksums
        working-directory: release-files
        run: |
          set -euo pipefail
          for file in *; do
            if [ "$file" != "SHA256SUMS.txt" ]; then
              sha256sum "$file"
            fi
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Skills Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-files/*
          body: |
            ## Skills Launcher ${{ github.ref_name }}

            Desktop-first Agent Skills manager for Windows, Linux and macOS.

            ### Assets

            - Windows x64: NSIS installer (`.exe`)
            - Linux x64: Debian package (`.deb`) and AppImage
            - macOS arm64: unsigned `.dmg`

            ### Highlights

            - 23 verified skill sources and 854 catalog skills in a fresh sync.
            - Real detection/install validation for Claude Code, Codex, Cursor, GitHub Copilot, Gemini CLI,
              Windsurf/Devin Desktop and OpenCode.
            - Risk levels are clickable and explain the scanner scale and install consequences.
            - Ubuntu 24.04, Ubuntu 26.04, macOS and Windows builds are covered by CI.

            ### Notes

            - macOS and Linux packages are unsigned; verify `SHA256SUMS.txt` before installing.
            - The Windows installer is the primary packaged build.
            - Bundled skills retain their original licenses and attribution.
